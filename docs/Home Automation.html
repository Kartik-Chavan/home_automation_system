<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Automation</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

dl{margin:0}dl div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}dl div:last-child{border:0}dt{color:var(--mu)}dd{margin:0;font-weight:600}

.sess,.chat{background:var(--cd);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);overflow:hidden}.sess{padding:12px;overflow-y:auto}.sess-head{display:none;align-items:center;justify-content:space-between;padding:4px 2px 10px}.sess ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.sess li{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 12px;border-radius:12px;cursor:pointer;transition:.2s}.sess li:hover{background:var(--ac2)}.sess li.on{background:var(--ac2);color:var(--ac);font-weight:600}.t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi{border:0;background:none;color:var(--mu);border-radius:8px;padding:6px;min-width:30px;height:30px;display:grid;place-items:center;transition:.2s}.mi:hover{color:var(--ac);background:var(--cd)}.mi.dg{color:#fff;background:var(--er);font-size:12px;padding:0 8px;animation:in .2s}
.rn{flex:1;min-width:0;border:1px solid var(--ac);border-radius:8px;padding:4px 8px;background:var(--cd)}
.chat{display:flex;flex-direction:column}.chat header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}.chat header div{display:flex;flex-direction:column}.mb{display:none}
.ms{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.b{max-width:80%;padding:10px 14px;border-radius:16px;animation:pop .25s ease;white-space:pre-wrap}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}}

.tl{display:block;font-size:12px;color:var(--ac);margin-bottom:4px}

.empty{margin:auto;text-align:center}.bot{width:64px;height:64px;margin:0 auto 8px;border-radius:20px;display:grid;place-items:center;background:var(--ac2);color:var(--ac);animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.chp{border:1px solid var(--bd);background:var(--cd);border-radius:99px;padding:6px 14px;transition:.2s}.chp:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-2px)}
.inp{display:flex;gap:8px;padding:12px;border-top:1px solid var(--bd)}.inp input,.form input{flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);width:100%}.inp input:focus,.form input:focus{border-color:var(--ac);outline:0}
.form{max-width:460px;margin-top:20px;display:grid;gap:16px}.form label{display:grid;gap:6px;font-weight:600}.row{display:flex;gap:8px}
.nf{text-align:center;padding:60px 0}.nf b{display:block;font-size:110px;line-height:1;letter-spacing:-.05em;color:var(--ac);animation:fl 3s ease-in-out infinite}
#t{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:9}#t.show{opacity:1;transform:translate(-50%,0)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.dc{display:flex;flex-direction:column;gap:2px;text-align:left;padding:16px;border-radius:22px;background:var(--cd);border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;transition:.25s;color:var(--tx)}.dc:hover{transform:translateY(-3px);border-color:var(--ac)}.dc:active{transform:scale(.97)}.dc.on{background:var(--ac2);border-color:var(--ac)}.dc.checking{opacity:.8}.dc.unreachable{background:#fff4e5;border-color:#e28b26;color:#5b3510}.dc.unreachable .pl,.dc.unreachable .cb{background:#e28b26;color:#fff}.last-check{margin-top:10px;padding-top:8px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu)}.dc.unreachable .last-check,.offline-note{color:#9a5411}
.dt{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.pl{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--bd);color:var(--mu);transition:.3s}.dc.on .pl{background:var(--ac);color:#fff}
.cb{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--bd);color:var(--mu);transition:.3s}.dc.on .cb{background:var(--ac);color:#fff}.cb:hover{transform:scale(1.12)}.cb:active{transform:scale(.88)}
.add{align-items:center;justify-content:center;border-style:dashed;min-height:150px;color:var(--mu);background:none;box-shadow:none}.add:hover{color:var(--ac)}
.ban{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:16px;background:var(--ac2);margin-bottom:16px;cursor:pointer;transition:.2s}.ban:hover{transform:translateX(3px)}
.devp{max-width:640px;margin:0 auto}.dh{align-items:center;gap:12px}.ttl{flex:1;display:flex;flex-direction:column}.stack{display:grid;gap:16px}.stack .hero{flex-direction:column;gap:20px}.big{font-size:32px;font-weight:700;letter-spacing:-.02em}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg);margin:6px 0 16px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;color:var(--mu);transition:.2s}.seg button.on{background:var(--cd);color:var(--tx);font-weight:600;box-shadow:var(--sh)}
.st{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}.st div{display:flex;flex-direction:column}.st b{font-size:19px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 8px;border-radius:20px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);text-decoration:none;transition:.25s}.tile:hover{transform:translateY(-3px);color:var(--ac);border-color:var(--ac)}
@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{gap:24px;padding:24px}nav{position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}nav a{flex-direction:column;gap:2px;font-size:12px;flex:1;align-items:center}
header.top{z-index:12}main{padding-bottom:110px}.agent{grid-template-columns:1fr;height:calc(100dvh - 210px)}.sess{position:fixed;inset:0 25% 0 0;z-index:8;border-radius:0 20px 20px 0;transform:translateX(-105%);transition:.3s;padding-top:calc(12px + env(safe-area-inset-top,0px))}.sess.open{transform:none}.sess-head{display:flex}.mb{display:grid}nav{z-index:13}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top"><div class="logo"><i id="lg"></i>Home</div>
<nav><a href="#/"><span class="ni" data-i="home"></span>Devices</a><a href="#/agent"><span class="ni" data-i="bot"></span>Agent</a><a href="#/settings"><span class="ni" data-i="sliders"></span>Settings</a></nav>

<script>
const $=s=>document.querySelector(s),ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={zap:'M13 2 3 14h9l-1 8 10-12h-9l1-8z',bot:'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16v4M17 18h4',clock:'M12 6v6l4 2',sliders:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',sun:'M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',moon:'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',home:'M3 11l9-8 9 8M5 10v10h14V10',plus:'M12 5v14M5 12h14',trash:'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',edit:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',send:'M22 2 11 13M22 2l-7 20-4-9-9-4z',wifi:'M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01M2 9a15 15 0 0 1 20 0',power:'M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0',menu:'M3 6h18M3 12h18M3 18h18',check:'M20 6 9 17l-5-5',left:'m15 18-6-6 6-6',right:'m9 18 6-6-6-6',cal:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',plane:'M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z'};

const D=ld('ha_devices',[]);let apiError='',apiBusy=false,dashboardBusy=false;
let eTab='today';
let cfg=ld('ha_cfg',{user:''}),S=ld('ha_s',[]),aid=ld('ha_a',null),th=ld('ha_t',null),ren=null,del=null,cur=0;
const mk=()=>({id:Date.now()+Math.random().toString(36).slice(2,6),n:'New session',m:[]});
if(!S.length)S=[mk()];if(!S.find(s=>s.id==aid))aid=S[0].id;
const cs=()=>S.find(s=>s.id==aid),save=()=>{sv('ha_s',S);sv('ha_a',aid)};

function applyT(){if(th)document.documentElement.dataset.theme=th;$('#tb').innerHTML=ic(dark()?'sun':'moon')}
let tt;function toast(m){const e=$('#t');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}
const timeLabel=value=>value?new Date(value).toLocaleString():'Not checked yet';

async function loadDevices(){if(dashboardBusy)return;dashboardBusy=true;const refreshButton=$('[data-a="refresh"]');if(refreshButton){refreshButton.disabled=true;refreshButton.classList.add('loading')}const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);try{const response=await fetch('/api/device/dashboard',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('server_response');const body=await response.json();if(!Array.isArray(body.devices))throw Error('invalid_response');D.splice(0,D.length,...body.devices);sv('ha_devices',D);apiError=''}catch(error){apiError=error.name==='AbortError'?'Server check timed out. Try again.':'Home server is unavailable. Check the Tailscale connection.';const checkedAt=new Date().toISOString();D.forEach(device=>{device.reachable=false;device.last_checked=checkedAt;device.error='Device status could not be refreshed.'})}finally{clearTimeout(timeout);dashboardBusy=false;const button=$('[data-a="refresh"]');if(button){button.disabled=false;button.classList.remove('loading')}}upd()}
function upd(){document.querySelectorAll('.dc[data-i]').forEach(c=>{const d=D[+c.dataset.i];if(!d)return;const online=d.reachable!==false&&!apiError;c.classList.toggle('on',online&&d.is_on);c.classList.toggle('unreachable',!online&&!dashboardBusy);c.classList.toggle('checking',dashboardBusy);c.querySelector('.cw').textContent=dashboardBusy?'Checking…':!online?'Unreachable':d.power_available===false?'Power unavailable':d.is_on?`${Math.round(Number(d.power_w)||0)} W`:'Off';const control=c.querySelector('.cb');if(control)control.disabled=dashboardBusy||!online;const checked=c.querySelector('.last-check');if(checked)checked.textContent=`Last checked: ${timeLabel(d.last_checked)}`;const errorLine=c.querySelector('.offline-note');if(errorLine){errorLine.textContent=apiError?'Home server could not be reached.':d.error||'Device could not be reached.';errorLine.hidden=online||dashboardBusy}});
if(!$('#pw'))return;const d=D[cur];if(!d)return;const online=d.reachable!==false&&!apiError,powerOk=online&&d.power_available!==false,w=powerOk?Number(d.power_w)||0:0,c=$('#chip'),mx=Math.max(50,Math.ceil(w*1.3/50)*50),m=eTab==='month';c.textContent=dashboardBusy?'Checking…':online?(d.is_on?'On':'Off'):'Unavailable';c.className='chip'+(online&&d.is_on?' on':'');$('#pw').classList.toggle('on',online&&d.is_on);$('#pw').disabled=apiBusy||dashboardBusy||!online;tw($('#w'),w);if(!powerOk||dashboardBusy)$('#w').textContent='—';$('#arc').style.strokeDashoffset=439.8*(1-Math.min(w/mx,1));

document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.i===eTab))}
setInterval(async()=>{const route=location.hash.slice(1)||'/';if(document.visibilityState==='visible'&&/^\/device\/\d+$/.test(route)){await loadDevices();upd()}},15000);
function home(){const L=D;
$('#v').innerHTML=`<div class="hd"><div><h1>${cfg.user?'Hi, '+esc(cfg.user):'Welcome home'}</h1><p class="mu">${apiError?esc(apiError):`${L.length} configured device${L.length==1?'':'s'}`}</p></div><button class="ib${dashboardBusy?' loading':''}" data-a="refresh" aria-label="Refresh device data" title="Check device connections" ${dashboardBusy?'disabled':''}>${ic('wifi',20)}</button></div>
${L.length?`<div class="cards">${L.map((d,i)=>`<div class="dc${d.reachable===false||apiError?' unreachable':d.is_on?' on':''}" role="button" tabindex="0" data-a="open" data-i="${i}"><div class="dt"><span class="pl">${ic('zap',22)}</span><button class="cb" data-a="tog" data-i="${i}" aria-label="Switch ${esc(d.name)}">${ic('power',22)}</button></div><b>${esc(d.name)}</b><small>${esc(d.model)}</small><small class="cw">${d.reachable===false||apiError?'Unreachable':d.power_available===false?'Power unavailable':d.is_on?`${Math.round(Number(d.power_w)||0)} W`:'Off'}</small><small class="last-check">Last checked: ${timeLabel(d.last_checked)}</small><small class="offline-note" ${d.reachable===false||apiError?'':'hidden'}>${esc(d.error||'Device could not be reached.')}</small></div>`).join('')}</div>`:`<section class="card"><h3>${dashboardBusy?'Checking devices...':apiError?'Server unavailable':'No device data'}</h3><p class="mu">${dashboardBusy?'Reading the latest device state.':apiError?'Check server connectivity, then tap the Wi-Fi button to retry.':'The API returned no configured devices.'}</p></section>`}`}
function dev(i){const d=D[i];cur=i;if(!d){$('#v').innerHTML=`<div class="devp"><div class="hd dh"><a class="ib" href="#/" aria-label="Back">${ic('left')}</a><div class="ttl"><h2>Device status</h2><small>${apiError?esc(apiError):'Loading latest device status...'}</small></div></div><section class="card">${apiError?'Device details could not be loaded. Use the Devices tab to retry.':'Checking the plug...'}</section></div>`;return}$('#v').innerHTML=`<div class="devp"><div class="hd dh"><a class="ib" href="#/" aria-label="Back">${ic('left')}</a><div class="ttl"><h2>${esc(d.name)}</h2><small>${esc(d.model)}</small></div><span id="chip" class="chip"></span></div><div class="stack">
<section class="card hero"><div class="ring"><svg viewBox="0 0 160 160"><circle class="tr" cx="80" cy="80" r="70"/><circle id="arc" class="ar" cx="80" cy="80" r="70" transform="rotate(-90 80 80)"/></svg><div class="ctr"><b id="w">0.0</b><span>watts right now</span></div></div><div class="ctl"><button id="pw" class="pw" data-a="tog" data-i="${i}" aria-label="Switch plug on or off">${ic('power',34)}</button><small>Tap to switch</small></div></section>
<section class="card" id="connection-card"><small>Device connection</small><div class="big" id="ev1"></div><div id="ev2" class="mu"></div><small id="last-detail-check" class="last-check"></small></section>
<section class="card"><h3>Energy usage</h3><div class="seg"><button data-a="etab" data-i="today">Today</button><button data-a="etab" data-i="month">This month</button></div><div class="st"><div><small>Runtime</small><b id="e1"></b></div><div><small>Energy</small><b id="e2"></b></div><div><small>Current power</small><b id="e3"></b></div></div></section>
<section class="card"><h3>Device info</h3><dl>${[['Model',d.model],['IP address',d.ip],['Wi-Fi signal',d.rssi==null?'Unavailable':`${d.rssi} dBm`],['Firmware',d.firmware]].map(r=>`<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl></section></div></div>`;upd()}
function agent(){$('#v').innerHTML=`<div class="agent"><aside class="sess" id="sl"></aside><section class="chat"><header><button class="ib mb" data-a="menu" aria-label="Sessions">${ic('menu')}</button><div><b id="at"></b><small>Connected to the home automation agent</small></div></header><div id="ms" class="ms"></div><div class="inp"><input id="in" placeholder="Ask about or control a device" autocomplete="off"><button class="btn pri" data-a="send" aria-label="Send">${ic('send',18)}</button></div></section></div>`;sl();msgs();at();$('#in').addEventListener('keydown',e=>{if(e.key==='Enter')A.send()})}
const at=()=>{const e=$('#at');if(e)e.textContent=cs().n};
function sl(){const e=$('#sl');if(!e)return;e.innerHTML=`<div class="sess-head"><b>Sessions</b><button class="ib" data-a="close-menu" aria-label="Close sessions" title="Close">${ic('left',18)}</button></div><button class="btn pri wide" data-a="snew">${ic('plus',18)} New session</button><ul>`+S.map(s=>`<li class="${s.id==aid?'on':''}" data-a="ssel" data-i="${s.id}">${ren==s.id?`<input class="rn" value="${esc(s.n)}" data-id="${s.id}">`:`<span class="t">${esc(s.n)}</span>`}<button class="mi" data-a="sren" data-i="${s.id}" title="Rename" aria-label="Rename">${ic('edit',16)}</button><button class="mi${del==s.id?' dg':''}" data-a="sdel" data-i="${s.id}" title="Delete" aria-label="Delete">${del==s.id?'Delete?':ic('trash',16)}</button></li>`).join('')+'</ul>';const r=$('.rn');if(r){r.focus();r.select();r.onkeydown=k=>{if(k.key==='Enter')r.blur();if(k.key==='Escape'){r.dataset.x=1;r.blur()}};r.onblur=()=>{if(!r.dataset.x){const s=S.find(x=>x.id==r.dataset.id);s.n=r.value.trim()||s.n}ren=null;save();sl();at()}}}
const bub=x=>`<div class="b ${x.r}">${x.tool?`<code class="tl">${esc(x.tool)}</code>`:''}<div>${esc(x.t)}</div></div>`;
function msgs(){const s=cs(),m=$('#ms');if(!m)return;m.innerHTML=s.m.length?s.m.map(bub).join(''):`<div class="empty"><div class="bot">${ic('bot',32)}</div><h3>How can I help?</h3><p class="mu">Try one of these.</p><div class="chips">${['Show device status','What is the current power?','Turn the device on','Turn the device off'].map(t=>`<button class="chp" data-a="chip" data-i="${t}">${t}</button>`).join('')}</div></div>`;m.scrollTop=m.scrollHeight}
function sett(){$('#v').innerHTML=`<h1>Settings</h1><p class="mu">Personal display settings.</p><section class="card form"><label>Your display name<input id="su" value="${esc(cfg.user||'')}" placeholder="Your name" autocomplete="off"></label><div class="row"><button class="btn pri" data-a="save">Save settings</button><button class="btn" data-a="clr">Clear</button></div></section>`}
function nf(){$('#v').innerHTML=`<div class="nf"><b>404</b><h2>Page not found</h2><p class="mu">This page hasn't been built yet.</p><p style="margin-top:20px"><a class="btn pri" href="#/">${ic('home',18)} Back to devices</a></p></div>`}
const A={theme(){th=dark()?'light':'dark';document.documentElement.dataset.theme=th;sv('ha_t',th);applyT()},
async tog(i){const d=D[+i];if(!d||d.reachable===false||apiError||apiBusy)return;apiBusy=true;upd();try{const response=await fetch(`/api/device/${d.is_on?'off':'on'}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});if(!response.ok)throw Error(`Device command failed (${response.status})`);const result=await response.json();await loadDevices();if(location.hash.startsWith('#/device/'))dev(+i);else home();toast(`${d.name} is ${result.is_on?'on':'off'}`)}catch(error){toast(error.message||'Device command failed')}finally{apiBusy=false;upd()}},
open(i){location.hash='#/device/'+i},
etab(t){eTab=t;upd()},
async refresh(){await loadDevices();if(location.hash.startsWith('#/device/'))dev(cur);else if(location.hash==='#/'||!location.hash)home();toast(apiError||(D.some(device=>device.reachable===false)?'One or more devices are unreachable':'All devices checked'))},
snew(){const s=mk();S.unshift(s);aid=s.id;ren=s.id;save();sl();msgs();at()},
ssel(i){aid=i;save();sl();msgs();at();$('#sl').classList.remove('open')},
sren(i){ren=i;sl()},
sdel(i){if(del!==i){del=i;setTimeout(()=>{if(del===i){del=null;sl()}},2500);sl();return}S=S.filter(s=>s.id!=i);del=null;if(!S.length)S=[mk()];if(aid==i)aid=S[0].id;save();sl();msgs();at()},
menu(){$('#sl').classList.toggle('open')},
'close-menu'(){$('#sl').classList.remove('open')},
chip(t){$('#in').value=t;A.send()},
async send(){const input=$('#in'),text=input.value.trim();if(!text)return;input.value='';const session=cs();session.m.push({r:'u',t:text});if(session.n==='New session')session.n=text.slice(0,28);save();sl();at();msgs();const messages=$('#ms');messages.insertAdjacentHTML('beforeend','<div class="b a typ"><i></i><i></i><i></i></div>');messages.scrollTop=messages.scrollHeight;input.disabled=true;try{const response=await fetch('/api/agent/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:'browser',session_id:String(session.id),query:text})});const body=await response.json();if(!response.ok)throw Error(body.detail||`Agent request failed (${response.status})`);session.m.push({r:'a',t:body.response||'The agent returned an empty response.'})}catch(error){session.m.push({r:'a',t:`Could not contact the agent: ${error.message}`})}finally{input.disabled=false;save();sl();at();if(cs()===session)msgs();input.focus()}},
save(){cfg={user:$('#su').value.trim()};sv('ha_cfg',cfg);toast('Settings saved')},
clr(){cfg={user:''};sv('ha_cfg',cfg);sett();toast('Settings cleared')}};
document.addEventListener('click',e=>{if(e.target.tagName==='INPUT')return;const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.stopPropagation();A[b.dataset.a](b.dataset.i||b,b)}});
document.addEventListener('click',e=>{const panel=$('#sl');if(panel?.classList.contains('open')&&!panel.contains(e.target)&&!e.target.closest('[data-a="menu"]'))panel.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sl')?.classList.remove('open')});
async function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/device\/(\d+)$/),k=m?'/':h;$('#sl')?.classList.remove('open');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+k));const v=$('#v');v.classList.remove('in');void v.offsetWidth;v.classList.add('in');if(h==='/'){home();await loadDevices();if(location.hash==='#/'||!location.hash)home();return}if(m){dev(+m[1]);await loadDevices();if(location.hash===h)dev(+m[1]);return}({'/agent':agent,'/settings':sett}[h]||nf)()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('dc'))e.target.click()});
document.querySelectorAll('.ni').forEach(e=>e.innerHTML=ic(e.dataset.i,18));$('#lg').innerHTML=ic('zap',18);applyT();addEventListener('hashchange',route);route();
</script></body></html>
