<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Home automation MCP network architecture</title>
  <desc id="description">An AI client reaches the MCP server through the public internet and Tailscale Funnel. GitHub is contacted separately for OAuth token verification. The MCP server calls the Tapo P110 over the home Wi-Fi LAN, then returns the response through the same application path.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147d64"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7654a5"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <style>
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #172033; }
      .subtitle { font: 400 15px 'Segoe UI', sans-serif; fill: #526070; }
      .label { font: 600 16px 'Segoe UI', sans-serif; fill: #172033; }
      .small { font: 400 13px 'Segoe UI', sans-serif; fill: #526070; }
      .edge { font: 600 13px 'Segoe UI', sans-serif; }
      .node { stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f7f9fc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Home Automation MCP Network Architecture</text>
  <text x="600" y="76" text-anchor="middle" class="subtitle">Normal tool calls and OAuth verification use different network paths</text>

  <rect x="40" y="105" width="1120" height="370" rx="18" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
  <text x="68" y="140" class="label">1. Normal MCP tool call</text>

  <rect x="70" y="190" width="190" height="92" rx="12" class="node" fill="#e8f2fb" stroke="#1769aa"/>
  <text x="165" y="224" text-anchor="middle" class="label">AI agent</text>
  <text x="165" y="248" text-anchor="middle" class="small">ChatGPT, Copilot, Claude</text>
  <text x="165" y="268" text-anchor="middle" class="small">MCP client</text>

  <rect x="330" y="190" width="190" height="92" rx="12" class="node" fill="#edf0fb" stroke="#5d63a8"/>
  <text x="425" y="224" text-anchor="middle" class="label">Public internet</text>
  <text x="425" y="248" text-anchor="middle" class="small">HTTPS request</text>
  <text x="425" y="268" text-anchor="middle" class="small">to the Funnel URL</text>

  <rect x="590" y="190" width="190" height="92" rx="12" class="node" fill="#f1ecfa" stroke="#7654a5"/>
  <text x="685" y="224" text-anchor="middle" class="label">Tailscale Funnel</text>
  <text x="685" y="248" text-anchor="middle" class="small">public HTTPS ingress</text>
  <text x="685" y="268" text-anchor="middle" class="small">port 8765 only</text>

  <rect x="850" y="190" width="250" height="92" rx="12" class="node" fill="#fff4dc" stroke="#b7791f"/>
  <text x="975" y="224" text-anchor="middle" class="label">Home server</text>
  <text x="975" y="248" text-anchor="middle" class="small">FastMCP + Python service</text>
  <text x="975" y="268" text-anchor="middle" class="small">127.0.0.1:8765</text>

  <line x1="260" y1="236" x2="330" y2="236" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="520" y1="236" x2="590" y2="236" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="780" y1="236" x2="850" y2="236" stroke="#7654a5" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="295" y="220" text-anchor="middle" class="edge" fill="#1769aa">request</text>
  <text x="555" y="220" text-anchor="middle" class="edge" fill="#1769aa">request</text>
  <text x="815" y="220" text-anchor="middle" class="edge" fill="#7654a5">forward</text>

  <rect x="850" y="345" width="250" height="92" rx="12" class="node" fill="#e9f7f1" stroke="#147d64"/>
  <text x="975" y="379" text-anchor="middle" class="label">Tapo P110</text>
  <text x="975" y="403" text-anchor="middle" class="small">local Wi-Fi / LAN</text>
  <text x="975" y="423" text-anchor="middle" class="small">KLAP device protocol</text>

  <line x1="975" y1="282" x2="975" y2="345" stroke="#147d64" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="995" y="320" class="edge" fill="#147d64">device command</text>

  <path d="M 975 437 L 975 455 L 165 455 L 165 282" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="560" y="448" text-anchor="middle" class="edge" fill="#6b7280">device response, then MCP response returns to the AI client</text>

  <rect x="40" y="510" width="1120" height="245" rx="18" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
  <text x="68" y="545" class="label">2. OAuth verification path</text>
  <text x="68" y="570" class="small">GitHub is used to verify identity and obtain claims. It is not in the normal Tapo LAN command path.</text>

  <rect x="180" y="620" width="250" height="82" rx="12" class="node" fill="#f1ecfa" stroke="#7654a5"/>
  <text x="305" y="652" text-anchor="middle" class="label">FastMCP server</text>
  <text x="305" y="676" text-anchor="middle" class="small">GitHub OAuth provider</text>

  <rect x="475" y="620" width="250" height="82" rx="12" class="node" fill="#f9eef0" stroke="#b04b5a"/>
  <text x="600" y="652" text-anchor="middle" class="label">GitHub</text>
  <text x="600" y="676" text-anchor="middle" class="small">api.github.com/user</text>

  <rect x="770" y="620" width="250" height="82" rx="12" class="node" fill="#fff4dc" stroke="#b7791f"/>
  <text x="895" y="652" text-anchor="middle" class="label">Allow-list check</text>
  <text x="895" y="676" text-anchor="middle" class="small">numeric GitHub user ID</text>

  <line x1="430" y1="661" x2="475" y2="661" stroke="#7654a5" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="725" y1="661" x2="770" y2="661" stroke="#7654a5" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="452" y="646" text-anchor="middle" class="edge" fill="#7654a5">verify</text>
  <text x="747" y="646" text-anchor="middle" class="edge" fill="#7654a5">claims</text>

  <text x="600" y="790" text-anchor="middle" class="subtitle">Only the MCP server port is exposed through Tailscale Funnel; the web app and LAN remain private.</text>
</svg>
